name: Deployment - Reusable Workflow

on: 
    workflow_call:
      secrets:
        k8s-kubeconfig:
          required: true
        mongodb-password:
          required: true
jobs: 
    reuse-deploy:
            environment: 
              name: development
              url: https://${{ steps.step1.outputs.APP_INGRESS_HOST }}:31375
            outputs: 
              APP_INGRESS_URL: ${{ steps.step1.outputs.APP_INGRESS_HOST }}
            runs-on: self-hosted
            steps:
              - name: Checkout Repository
                uses: actions/checkout@v4           
              - name: Install kubectl CLI
                uses: azure/setup-kubectl@v4
                with:
                  version: 'v1.34.0'            
              - name: Set Kubeconfig
                uses: azure/k8s-set-context@v4
                with:
                  method: kubeconfig
                  kubeconfig: ${{ secrets.k8s-kubeconfig }}           
              - name: Fetch cluster details
                run: |
                  kubectl version
                  echo ----------------------------------------------------
                  kubectl get nodes           
              - name: Get ingress IP
                run: |
                  NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
                  echo "INGRESS_IP=${NODE_IP}" >> $GITHUB_ENV           
              - name: Replace Token in manifest files
                uses: cschleiden/replace-tokens@v1
                with:
                  tokenPrefix: '_{_'
                  tokenSuffix: '_}_'
                  files: '["kubernetes/development/*.yaml"]'
                env:
                  NAMESPACE: ${{ vars.NAMESPACE }}
                  REPLICAS: ${{ vars.REPLICAS }}
                  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
                  INGRESS_IP: ${{ env.INGRESS_IP }}           
              - name: Check files
                run: |
                  cat kubernetes/development/*.yaml           
              - name: Create MongoDB Secret
                run: |
                  kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
                    --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
                    --from-literal=MONGO_USERNAME=${{ vars.MONGO_USERNAME }} \
                    --from-literal=MONGO_PASSWORD=${{ secrets.mongodb-password }} \
                    --save-config \
                    --dry-run=client \
                    -o yaml | kubectl apply -f -            
              - name: Deploy to Dev Env
                run: |
                  kubectl apply -f kubernetes/development           
              - name: Set App Ingress Host URL
                id: step1
                run: |
                  echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath="{.items[0].spec.tls[0].hosts[0]}")" >> "$GITHUB_OUTPUT"
